[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attrition"
version = "0.1.0"
description = "LLM Agents, War of Attrition, and the US Debt Ceiling"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100.0",
    "streamlit>=1.57.0",
    "plotly>=6.7.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "lifelines>=0.27.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
    "fredapi>=0.5.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
